- type: markingPoints
  id: MobOviniaMarkingLimits
  onlyWhitelisted: true
  points:
    Hair:
      points: 1
      required: false
    FacialHair:
      points: 1
      required: false
    Head:
      points: 6
      required: false
    HeadTop:
      points: 2
      required: false
    HeadSide:
      points: 1
      defaultMarkings: [ OviniaEars ]
      required: true
    UndergarmentTop:
      points: 1
      required: false
    UndergarmentBottom:
      points: 1
      required: false
    Chest:
      points: 6
      required: false
    Snout:
      points: 1
      required: true
      defaultMarkings: [ OviniaSnout ]
    Tail:
      points: 1
      required: true
      defaultMarkings: [ OviniaTail ]
    Arms:
      points: 6
      required: false
    Legs:
      points: 6
      required: false

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceOvinia
  name: ovinia appearance
  components:
  - type: Inventory
    displacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: _MACRO/Mobs/Species/Ovinia/displacement.rsi
            state: jumpsuit
      shoes:
        sizeMaps:
          32:
            sprite: _MACRO/Mobs/Species/Ovinia/displacement.rsi
            state: shoes
      outerClothing:
        sizeMaps:
          32:
            sprite: _MACRO/Mobs/Species/Ovinia/displacement.rsi
            state: outerclothing-hardsuit
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: _MACRO/Mobs/Species/Ovinia/displacement.rsi
            state: jumpsuit-female
  - type: InitialBody
    organs:
      Torso: OrganOviniaTorso
      Head: OrganOviniaHead
      ArmLeft: OrganOviniaArmLeft
      ArmRight: OrganOviniaArmRight
      HandRight: OrganOviniaHandRight
      HandLeft: OrganOviniaHandLeft
      LegLeft: OrganOviniaLegLeft
      LegRight: OrganOviniaLegRight
      FootLeft: OrganOviniaFootLeft
      FootRight: OrganOviniaFootRight
      Brain: OrganOviniaBrain
      Eyes: OrganOviniaEyes
      Tongue: OrganOviniaTongue
      Appendix: OrganOviniaAppendix
      Ears: OrganOviniaEars
      Lungs: OrganOviniaLungs
      Heart: OrganOviniaHeart
      Stomach: OrganOviniaStomach
      Liver: OrganOviniaLiver
      Kidneys: OrganOviniaKidneys
  - type: HumanoidProfile
    species: Ovinia

- type: entity
  parent:
  - AppearanceOvinia
  - BaseSpeciesMobOrganic
  id: MobOvinia
  name: Urist McSheepie
  components:
  - type: TypingIndicator
    proto: ovinia
  - type: Vocal
    emoteSounds: MaleOvinia
  - type: Speech
    speechSounds: Ovinia
    speechVerb: Ovinia
    allowedEmotes: [ 'Baa', 'Moo' ]
  - type: Damageable
    damageModifierSet: Ovinia
  - type: Flammable
  - type: FireStackModifier
    modifier: 0.75 # less fire stacks!
  - type: EatTimeModifier
    modifier: 1.2 # quite slow eaters
  - type: Hunger
    baseDecayRate: 0.0083 # slower than normal (chewin they cud)
  - type: Thirst
    baseDecayRate: 0.0083 # slower than normal
  - type: SleepTimeModifier
    modifier: 2
  - type: PettingChanceModifier
    modifier: 1.2
  - type: ProtectedFromStepTriggers
  - type: Tag
    tags:
    - OviniaEmotes
    - DoorBumpOpener
    - CanPilot
    - FootstepSound
    - AnomalyHost

  - type: NpcFactionMember
    factions:
    - AnimalFriend

